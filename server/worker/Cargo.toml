[package]
name = "wuxia-worker"
description = "The wuxia game server on Cloudflare Workers: HTTP auth, Durable Objects, realtime WebSockets."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wuxia-core = { path = "../core" }
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
