# The wuxia game server (docs/online.md). Deploy: `npx wrangler deploy` from
# this folder. Nothing to configure: the token-signing key is made and kept by
# the server itself (KeyObject, src/keys.rs), so it survives every deploy.
#
# Two halves in one Worker: ts/entry.ts (TypeScript: the shared world and
# checked battles, friends / party / mail, running the game's own engines from
# lib/) is the entry; it
# hands everything else to the Rust half (src/, built into build/ by
# worker-build, imported as "wuxia-rust").
name = "wuxia-world"
main = "ts/entry.ts"
compatibility_date = "2026-01-01"
# The game data is large (Thai text): minified it loads faster.
minify = true

[alias]
"wuxia-rust" = "./build/index.js"

[build]
command = "cargo install -q worker-build@^0.8 && worker-build --release"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountObject"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[durable_objects.bindings]]
name = "KEYS"
class_name = "KeyObject"

[[durable_objects.bindings]]
name = "WORLD"
class_name = "WorldObject"

[[durable_objects.bindings]]
name = "BATTLES"
class_name = "BattleObject"

[[durable_objects.bindings]]
name = "HUBS"
class_name = "PlayerHub"

[[durable_objects.bindings]]
name = "PARTIES"
class_name = "PartyObject"

[[durable_objects.bindings]]
name = "RAIDS"
class_name = "RaidObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AccountObject", "RoomObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KeyObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["WorldObject", "BattleObject"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["PlayerHub", "PartyObject"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["RaidObject"]

[vars]
# PBKDF2 rounds for new passwords (Workers bill CPU time; raise on a paid plan).
PBKDF2_ITERATIONS = "10000"
