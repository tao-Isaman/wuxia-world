[package]
name = "wuxia-core"
description = "Pure, event-based logic of the wuxia game server: wire protocol, room state (decide / apply), auth crypto."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
