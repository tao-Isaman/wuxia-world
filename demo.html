  {id:'C3',n:'ประดับปัญญาสวรรค์', ty:'C',atkb:0, pdb:0,  idb:0, hpb:250, mpb:0,  st:{INT:5,POW:5},        eff:{t:'pct_atk',v:6}},
  {id:'C4',n:'ประดับชีวิตนิรันดร์',ty:'C',atkb:0, pdb:0,  idb:0, hpb:500, mpb:0,  st:{VIT:10},             eff:{t:'hp_regen',v:5}},
  {id:'C5',n:'ประดับมังกรเทพ',    ty:'C',atkb:0, pdb:0,  idb:0, hpb:450, mpb:0,  st:{STR:5,VIT:5},        eff:{t:'pct_reduce',v:8}},

let CH={A:{n:'ยุนม่อ',s:{STR:1,AGI:1,POW:1,VIT:1,DEX:1,LUK:1,DEF:1,INT:1}},B:{n:'ผู้พิทักษ์',s:{STR:1,AGI:1,POW:1,VIT:1,DEX:1,LUK:1,DEF:1,INT:1}}};
let asel={A:'none',B:'none'},alv={A:5,B:5};
let EQ={A:[null,null,null,null,null],B:[null,null,null,null,null]};
let eqd={
  A:{W:null,A:null,H:null,B:null,BR:[null,null],R:[null,null],C:[null,null]},

};

function ST(i){[0,1,2].forEach(j=>{document.getElementById('t'+j).style.display=j===i?'':'none';document.querySelectorAll('.tb')[j].classList.toggle('on',j===i);});if(i===1)renderLib();if(i===2)renderBV();}
function gArt(s){return ARTS.find(a=>a.id===asel[s])||ARTS[0];}
function opp(s){return s==='A'?'B':'A';}
function gSk(id){return SP.find(x=>x.id===id)||null;}
function gTot(s){return STATKEYS.reduce((t,k)=>t+CH[s].s[k],0);}

// Equipment helpers
function gEqItems(s){
  const q=eqd[s];
  return [q.W,q.A,q.H,q.B,...q.BR,...q.R,...q.C].filter(Boolean).map(id=>EQUIP.find(e=>e.id===id)).filter(Boolean);
}
function gEqBonus(s){
  const b={atk:0,pd:0,id_:0,hp:0,mp:0,cri:0,eva:0,pct_atk:0,pct_red:0,hp_regen:0};
  gEqItems(s).forEach(e=>{
    b.atk+=e.atkb||0; b.pd+=e.pdb||0; b.id_+=e.idb||0; b.hp+=e.hpb||0; b.mp+=e.mpb||0;
    if(e.eff){
      if(e.eff.t==='flat_cri')   b.cri+=e.eff.v;
      if(e.eff.t==='flat_eva')   b.eva+=e.eff.v;
      if(e.eff.t==='pct_atk')    b.pct_atk+=e.eff.v;
      if(e.eff.t==='pct_reduce') b.pct_red+=e.eff.v;
      if(e.eff.t==='hp_regen')   b.hp_regen+=e.eff.v;
    }
  });
  return b;
}
function gEqStBon(s){
  const st={};
  gEqItems(s).forEach(e=>Object.entries(e.st||{}).forEach(([k,v])=>{st[k]=(st[k]||0)+v;}));
  return st;
}
function eqEffDesc(eff){
  if(!eff)return'';
  if(eff.t==='pct_atk')   return`+${eff.v}%ATK`;
  if(eff.t==='flat_cri')  return`Cri+${eff.v}`;
  if(eff.t==='flat_eva')  return`Eva+${eff.v}`;
  if(eff.t==='pct_reduce')return`ลดDmg${eff.v}%`;
  if(eff.t==='hp_regen')  return`ฟื้น${eff.v}%/ตา`;
  if(eff.t==='on_hit')    return`OnHit:${eff.db?.t?.replace('debuff_','')||''}${eff.db?.v||''}`;
  return'';
}
function eqItemDesc(id){
  const e=EQUIP.find(x=>x.id===id);if(!e)return'';
  const p=[];
  if(e.atkb)p.push(`Atk+${e.atkb}`);if(e.pdb)p.push(`PD+${e.pdb}`);if(e.idb)p.push(`ID+${e.idb}`);
  if(e.hpb) p.push(`HP+${e.hpb}`); if(e.mpb)p.push(`MP+${e.mpb}`);
  const sb=Object.entries(e.st||{}).map(([k,v])=>`${k}+${v}`).join(' ');
  if(sb)p.push(sb);
  const ef=eqEffDesc(e.eff);if(ef)p.push(ef);
  return p.join(' ');
}

function combStats(s){
  const b={...CH[s].s},art=gArt(s);
  if(art.id!=='none'){const f=alv[s]/10;Object.keys(art.stats).forEach(k=>{b[k]=(b[k]||0)+Math.floor(art.stats[k]*f);});}
  EQ[s].forEach(id=>{const sk=gSk(id);if(sk)Object.entries(sk.st||{}).forEach(([k,v])=>{b[k]=(b[k]||0)+v;});});
  Object.entries(gEqStBon(s)).forEach(([k,v])=>{b[k]=(b[k]||0)+v;});
  return b;
}
function derive(o){return{HP:o.VIT*20+o.DEF*10+o.STR*3,MP:o.POW*12+o.INT*4,Atk:o.STR*3+o.AGI+o.POW+o.DEX+o.INT*2,PA:o.STR*2+o.DEX+o.LUK,IA:o.POW*2+o.DEX+o.LUK,PD:o.DEF*2+o.VIT+o.INT*2,ID:o.DEF*2+o.POW+o.VIT+o.INT*2,Eva:o.AGI*2,Acc:o.DEX*2,Cri:o.STR+o.LUK,Res:o.LUK+Math.floor(o.DEF*.5),Spd:Math.max(o.AGI*2,1)};}
function deriveAll(s){
  const d=derive(combStats(s)),art=gArt(s);
  if(art.id!=='none'){d.HP+=art.hL*alv[s];d.MP+=art.mL*alv[s];}
  const eb=gEqBonus(s);
  d.Atk+=eb.atk; d.PD+=eb.pd; d.ID+=eb.id_; d.HP+=eb.hp; d.MP+=eb.mp; d.Cri+=eb.cri; d.Eva+=eb.eva;
  return d;
}
function getMas(s){const m={};EQ[s].forEach(id=>{const sk=gSk(id);if(sk)m[sk.w]=Math.min(200,(m[sk.w]||0)+sk.mg);});return m;}
function getWM(s,w){return getMas(s)[w]||0;}
function hpPct(a,e){return Math.min(Math.max(80+(a-e)/4,5),95);}
function crPct(c,r){return Math.min(Math.max(3+(c-r)/3,0),75);}
function hpC(p){return p>50?'#1D9E75':p>20?'#BA7517':'#E24B4A';}

function updStat(s,k,v){const ot=gTot(s)-CH[s].s[k],cv=Math.min(Math.max(v,1),Math.min(BUDGET-ot,100));CH[s].s[k]=cv;const sl=document.getElementById('sl-'+s+'-'+k),sv=document.getElementById('sv-'+s+'-'+k);if(sl)sl.value=cv;if(sv)sv.textContent=cv;rMax(s);rPts(s);rDv(s);}
function rMax(s){const r=BUDGET-gTot(s);STATKEYS.forEach(k=>{const sl=document.getElementById('sl-'+s+'-'+k);if(sl)sl.max=Math.min(CH[s].s[k]+r,100);});}
function rPts(s){const tot=gTot(s),rem=BUDGET-tot,p=tot/BUDGET*100,bc=rem===0?'#E24B4A':rem<20?'#BA7517':'#7F77DD';document.getElementById('p'+s).innerHTML=`<div class="prow"><span>คะแนน <b>${tot}</b>/${BUDGET}</span><span style="${rem===0?'color:#E24B4A':''}">เหลือ ${rem}</span></div><div class="pbw"><div class="pbf" style="width:${p}%;background:${bc}"></div></div>`;}

function rDv(s){
  const pure=derive(CH[s].s),all=deriveAll(s),el=document.getElementById('dv'+s);if(!el)return;
  const df=(cv,bv)=>cv>bv?`<span class="iad">+${cv-bv}</span>`:'';
  const it=[['HP',all.HP,pure.HP],['MP',all.MP,pure.MP],['ATK',all.Atk,pure.Atk],['PA',all.PA,pure.PA],['IA',all.IA,pure.IA],['PD',all.PD,pure.PD],['ID',all.ID,pure.ID],['SPD',all.Spd,pure.Spd],['Eva',all.Eva,pure.Eva],['Acc',all.Acc,pure.Acc],['Cri',all.Cri,pure.Cri],['Res',all.Res,pure.Res]];
  el.innerHTML=it.map(([l,cv,bv])=>`<div class="dv"><div class="dvl">${l}</div><div class="dvv">${cv}${df(cv,bv)}</div></div>`).join('');
}

function rIA(s){
  const el=document.getElementById('ia'+s);if(!el)return;
  const art=gArt(s),lv=alv[s];
  const opts=ARTS.map(a=>`<option value="${a.id}" ${a.id===asel[s]?'selected':''}>${a.n}</option>`).join('');

  el.innerHTML=`<div class="sec"><div class="stt">กำลังภายใน</div><div class="ia-r"><select onchange="asel['${s}']=this.value;rIA('${s}');rDv('${s}')">${opts}</select><label>ขั้น</label><input type="range" min="1" max="10" value="${lv}" oninput="alv['${s}']=+this.value;document.getElementById('ilv${s}').textContent=this.value;rIA('${s}');rDv('${s}')"><span id="ilv${s}">${lv}</span></div>${info}</div>`;

function rSS(s){
  const el=document.getElementById('ss'+s);if(!el)return;
  const used=EQ[s].filter(Boolean),mas=getMas(s);
  const skBon={};EQ[s].forEach(id=>{const sk=gSk(id);if(sk)Object.entries(sk.st||{}).forEach(([k,v])=>{skBon[k]=(skBon[k]||0)+v;});});
  const bonStr=Object.entries(skBon).map(([k,v])=>`${k}+${v}`).join(' ')||'—';

function rEQ(s){
  const el=document.getElementById('eq'+s);if(!el)return;
  const q=eqd[s];
  const SLOTS=[
    {key:'W', n:'🗡 อาวุธ',    ty:'W', cnt:1},
    {key:'A', n:'👘 เสื้อ',    ty:'A', cnt:1},
    {key:'H', n:'🪖 หมวก',    ty:'H', cnt:1},
    {key:'B', n:'👟 รองเท้า',  ty:'B', cnt:1},
    {key:'BR',n:'💪 ปลอกแขน', ty:'BR',cnt:2},
    {key:'R', n:'💍 แหวน',     ty:'R', cnt:2},
    {key:'C', n:'🎖 ประดับ',   ty:'C', cnt:2},
  ];
  const mkOpts=(ty,cur)=>`<option value="">— ว่าง —</option>`+
    EQUIP.filter(e=>e.ty===ty).map(e=>`<option value="${e.id}" ${e.id===cur?'selected':''}>${e.n}</option>`).join('');

  let html='';
  SLOTS.forEach(sl=>{
    if(sl.cnt===1){
      const cur=q[sl.key],tag=cur?`<span class="eq-tag">${eqItemDesc(cur)}</span>`:'';
      html+=`<div class="eq-row"><span class="eq-lbl">${sl.n}</span><select class="eq-sel" onchange="eqd['${s}']['${sl.key}']=this.value||null;rEQ('${s}');rDv('${s}')">${mkOpts(sl.ty,cur)}</select>${tag}</div>`;
    }else{
      [0,1].forEach(i=>{
        const cur=q[sl.key][i],tag=cur?`<span class="eq-tag">${eqItemDesc(cur)}</span>`:'';
        html+=`<div class="eq-row"><span class="eq-lbl">${i===0?sl.n:''}</span><select class="eq-sel" onchange="eqd['${s}']['${sl.key}'][${i}]=this.value||null;rEQ('${s}');rDv('${s}')">${mkOpts(sl.ty,cur)}</select>${tag}</div>`;
      });
    }
  });

  const eb=gEqBonus(s);
  const sum=[];
  if(eb.atk)    sum.push(`Atk+<b>${eb.atk}</b>`);
  if(eb.pd)     sum.push(`PD+<b>${eb.pd}</b>`);
  if(eb.id_)    sum.push(`ID+<b>${eb.id_}</b>`);
  if(eb.hp)     sum.push(`HP+<b>${eb.hp}</b>`);
  if(eb.mp)     sum.push(`MP+<b>${eb.mp}</b>`);
  if(eb.cri)    sum.push(`Cri+<b>${eb.cri}</b>`);
  if(eb.eva)    sum.push(`Eva+<b>${eb.eva}</b>`);
  if(eb.pct_atk)sum.push(`ATK+<b>${eb.pct_atk}%</b>`);
  if(eb.pct_red)sum.push(`ลดDmg<b>${eb.pct_red}%</b>`);
  if(eb.hp_regen)sum.push(`ฟื้น<b>${eb.hp_regen}%</b>/ตา`);
  const stb=Object.entries(gEqStBon(s)).map(([k,v])=>`${k}+<b>${v}</b>`);
  const total=[...sum,...stb].join(' · ')||'ไม่มีโบนัส';

  el.innerHTML=`<div class="sec"><div class="stt">อุปกรณ์ (9 ช่อง)</div>${html}<div class="eq-sum">รวม: ${total}</div></div>`;
  makeSearchable(el);
}

// === BATTLE ===
function addBuf(s,b){battle.st[s].buffs=battle.st[s].buffs.filter(x=>x.t!==b.t);battle.st[s].buffs.push({...b});}
function addDeb(s,d){battle.st[s].debuffs=battle.st[s].debuffs.filter(x=>x.t!==d.t);battle.st[s].debuffs.push({...d});}
function lg(cls,txt){battle.log.push({cls,txt});if(battle.log.length>100)battle.log.shift();}
function checkWin(){if(battle.winner)return;const w=battle.hA<=0?'B':battle.hB<=0?'A':null;if(w){battle.winner=w;battle.phase='over';lg('lS',`━━ ${CH[w].n} ชนะ! (${battle.turn} ตา) ━━`);}}

function tickFX(){
  if(battle.winner)return;
  ['A','B'].forEach(s=>{
    const st=battle.st[s],poi=st.debuffs.find(d=>d.t==='debuff_poison');
    if(poi&&poi.u>0){const dmg=Math.round(battle['d'+s].HP*poi.pp/100);battle['h'+s]=Math.max(0,battle['h'+s]-dmg);if(dmg>0)lg('lS',`&nbsp;☠ ${CH[s].n} รับพิษ ${dmg}`);}
    st.buffs.forEach(b=>{if(b.u>0)b.u--;});st.buffs=st.buffs.filter(b=>b.u>0);
    st.debuffs.forEach(d=>{if(d.u>0)d.u--;});st.debuffs=st.debuffs.filter(d=>d.u>0);
    if(battle['h'+s]<=0&&!battle.winner){battle.winner=opp(s);battle.phase='over';lg('lS',`━━ ${CH[battle.winner].n} ชนะ! (พิษ) ━━`);}
    // HP regen from equipment
    const regen=gEqBonus(s).hp_regen;
    if(regen>0&&battle['h'+s]>0&&!battle.winner){const h=Math.round(battle['d'+s].HP*regen/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+h);if(h>0)lg('lS',`&nbsp;💊 ${CH[s].n} ฟื้น ${h} (อุปกรณ์)`);}
  });
}

function chkPas(s,trigger){
  const art=gArt(s);if(!art.pas||art.pas.tr!==trigger)return;
  if(Math.random()*100>=art.pas.ch)return;
  const e=art.pas.e,ds=opp(s);
  if(e.t==='buff_def'){addBuf(s,{t:'buff_def',n:e.n||'DEF↑',v:e.v,u:e.u});lg('lS',`&nbsp;◆ ${CH[s].n}: DEF+${e.v}(${e.u}ตา)`);}
  else if(e.t==='buff_eva'){addBuf(s,{t:'buff_eva',n:e.n||'Eva↑',v:e.v,u:e.u});lg('lS',`&nbsp;◆ ${CH[s].n}: Eva+${e.v}(${e.u}ตา)`);}
  else if(e.t==='heal_pct'){const h=Math.round(battle['d'+s].HP*e.v/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+h);lg('lS',`&nbsp;◆ ${CH[s].n} ฟื้น ${h} HP`);}
  else if(e.t==='debuff_acc'){addDeb(ds,{t:'debuff_acc',n:e.n||'Acc↓',v:e.v,u:e.u});lg('lS',`&nbsp;◆ ${CH[ds].n}: Acc${e.v}(${e.u}ตา)`);}
  else if(e.t==='debuff_eva'){addDeb(ds,{t:'debuff_eva',n:e.n||'Eva↓',v:e.v,u:e.u});lg('lS',`&nbsp;◆ ${CH[ds].n}: Eva${e.v}(${e.u}ตา)`);}
  else if(e.t==='debuff_def'){addDeb(ds,{t:'debuff_def',n:e.n||'DEF↓',v:e.v,u:e.u});lg('lS',`&nbsp;◆ ${CH[ds].n}: PDef${e.v}(${e.u}ตา)`);}
  else if(e.t==='stack_atk'){const cur=battle.st[s].stk||0;if(cur<e.mx){battle.st[s].stk++;lg('lS',`&nbsp;◆ ${CH[s].n}: ATK+${battle.st[s].stk*e.v}%`);}}
}

function calcDmg(side,sk){
  const ds=opp(side),ad=battle['d'+side],dd=battle['d'+ds],ast=battle.st[side],dst=battle.st[ds];
  const aid=gArt(side).id;
  let iatkBuff=0; ast.buffs.forEach(b=>{if(b.t==='buff_iatk')iatkBuff+=b.v;});
  let im=1+iatkBuff/100,ab=1;
  if(aid==='taiji'&&sk.at==='int')im=(1+iatkBuff/100)*1.12;
  if(aid==='scholar'&&sk.at==='int'){im=1+iatkBuff/100;ab=1.10;}
  const sm=1+(ast.stk||0)*0.03+gEqBonus(side).pct_atk/100;
  let ea=ad.Acc;ast.debuffs.forEach(d=>{if(d.t==='debuff_acc')ea=Math.max(0,ea+d.v);});
  let ee=dd.Eva;dst.debuffs.forEach(d=>{if(d.t==='debuff_eva')ee=Math.max(0,ee+d.v);});dst.buffs.forEach(b=>{if(b.t==='buff_eva')ee+=b.v;});
  let fD=0,pR=0,ref=0,dR=0;
  dst.buffs.forEach(b=>{if(b.t==='buff_def')fD+=b.v;if(b.t==='buff_reduce')pR+=b.v;if(b.t==='buff_reflect')ref=b.v;});
  dst.debuffs.forEach(d=>{if(d.t==='debuff_def')dR+=Math.abs(d.v);});
  pR+=gEqBonus(ds).pct_red;
  const mas=getWM(side,sk.w),mm=1+(mas/200)*.5;
  const ta=sk.at==='phy'?ad.PA:ad.IA*im;
  const se=(sk.bp||0)*(1+(sk.p||0)/100)+(sk.f||0);
  const ed=Math.max(0,(sk.at==='phy'?dd.PD:dd.ID)+fD-dR);
  const raw=Math.max(1,(ad.Atk*sm*ab+ta+se)*(sk.dm||1)*mm-ed)*(1-pR/100);
  const hp=hpPct(ea,ee);
  if(Math.random()*100>=hp)return{hit:false,dmg:0,crit:false,hp:Math.round(hp),cp:0,refl:0};
  const cp=crPct(ad.Cri,dd.Res),crit=Math.random()*100<cp,dmg=Math.round(raw*(crit?1.5:1));
  let rd=0;if(ref>0){rd=Math.round(dmg*ref/100);dst.buffs=dst.buffs.filter(b=>b.t!=='buff_reflect');}
  return{hit:true,dmg,crit,hp:Math.round(hp),cp:Math.round(cp),refl:rd};
}

function applySelf(caster,eff){
  if(!eff)return;const s=caster;
  if(eff.t==='buff_reflect'){addBuf(s,{t:'buff_reflect',n:'สะท้อน',v:eff.v,u:eff.u});lg('lS',`&nbsp;⟳ ${CH[s].n}: สะท้อน${eff.v}%(${eff.u}ตา)`);}
  else if(eff.t==='buff_eva'){addBuf(s,{t:'buff_eva',n:'ว่องไว',v:eff.v,u:eff.u});lg('lS',`&nbsp;⟳ ${CH[s].n}: Eva+${eff.v}(${eff.u}ตา)`);}
  else if(eff.t==='buff_reduce'){addBuf(s,{t:'buff_reduce',n:'เกราะ',v:eff.v,u:eff.u});lg('lS',`&nbsp;⟳ ${CH[s].n}: ลดdmg${eff.v}%(${eff.u}ตา)`);}
  else if(eff.t==='buff_def'){addBuf(s,{t:'buff_def',n:'DEF↑',v:eff.v,u:eff.u});lg('lS',`&nbsp;⟳ ${CH[s].n}: DEF+${eff.v}(${eff.u}ตา)`);}
  else if(eff.t==='heal_pct'){const h=Math.round(battle['d'+s].HP*eff.v/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+h);lg('lS',`&nbsp;⟳ ${CH[s].n}: ฟื้น${h}HP`);}
  else if(eff.t==='heal_buff'){const h=Math.round(battle['d'+s].HP*eff.hp/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+h);addBuf(s,{t:eff.bt,n:'บัฟ',v:eff.bv,u:eff.bu});lg('lS',`&nbsp;⟳ ${CH[s].n}: ฟื้น${h}HP+${eff.bt}+${eff.bv}(${eff.bu}ตา)`);}
  else if(eff.t==='stack_atk'){const cur=battle.st[s].stk||0;if(cur<eff.mx){battle.st[s].stk++;lg('lS',`&nbsp;⟳ ${CH[s].n}: ATK+${battle.st[s].stk*eff.v}%`);}}
  else if(eff.t==='buff_iatk_reduce'){addBuf(s,{t:'buff_iatk',n:'ลมปราณอุดร',v:eff.iv,u:eff.u});addBuf(s,{t:'buff_reduce',n:'ลดรับ',v:eff.rv,u:eff.u});lg('lS',`&nbsp;⟳ ${CH[s].n}: IAtk+${eff.iv}% + ลดรับ${eff.rv}%(${eff.u}ตา)`);}
  else if(eff.t==='buff_reflect_eva'){addBuf(s,{t:'buff_reflect',n:'ดาวคล้อย',v:eff.rv,u:eff.u});addBuf(s,{t:'buff_eva',n:'ดาวคล้อย',v:eff.ev,u:eff.u});lg('lS',`&nbsp;⟳ ${CH[s].n}: สะท้อน${eff.rv}% + Eva+${eff.ev}(${eff.u}ตา)`);}
}

function applyEnemy(caster,eff){
  if(!eff)return;const ds=opp(caster);
  if(eff.t==='debuff_eva'){addDeb(ds,{t:'debuff_eva',n:'Eva↓',v:eff.v,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: Eva${eff.v}(${eff.u}ตา)`);}
  else if(eff.t==='debuff_acc'){addDeb(ds,{t:'debuff_acc',n:'Acc↓',v:eff.v,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: Acc${eff.v}(${eff.u}ตา)`);}
  else if(eff.t==='debuff_def'){addDeb(ds,{t:'debuff_def',n:'DEF↓',v:eff.v,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: PDef${eff.v}(${eff.u}ตา)`);}
  else if(eff.t==='debuff_poison'){addDeb(ds,{t:'debuff_poison',n:'พิษ',pp:eff.pp,u:eff.u});addDeb(ds,{t:'debuff_eva',n:'พิษEva',v:eff.ev,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: พิษ${eff.pp}%/ตา Eva${eff.ev}(${eff.u}ตา)`);}
  else if(eff.t==='multi_debuff'){addDeb(ds,{t:'debuff_acc',n:'Acc↓',v:eff.av,u:eff.u});addDeb(ds,{t:'debuff_eva',n:'Eva↓',v:eff.ev,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: Acc${eff.av} Eva${eff.ev}(${eff.u}ตา)`);}
  else if(eff.t==='heavy_poison'){addDeb(ds,{t:'debuff_poison',n:'พิษร้าย',pp:eff.pp,u:eff.u});addDeb(ds,{t:'debuff_acc',n:'พิษAcc',v:eff.av,u:eff.u});addDeb(ds,{t:'debuff_eva',n:'พิษEva',v:eff.ev,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: พิษ${eff.pp}%/ตา Acc${eff.av} Eva${eff.ev}(${eff.u}ตา)`);}
  else if(eff.t==='drain_mp'){const mpDrain=Math.round(battle['d'+ds].MP*eff.v/100);const gained=Math.min(battle['mp'+ds],mpDrain);battle['mp'+ds]=Math.max(0,battle['mp'+ds]-gained);battle['mp'+opp(ds)]=Math.min(battle['d'+opp(ds)].MP,battle['mp'+opp(ds)]+gained);lg('lS',`&nbsp;✗ ${CH[ds].n}: ดูด MP ${gained}`);}
  else if(eff.t==='dispel'){const rm=battle.st[ds].buffs.shift();addDeb(ds,{t:'debuff_acc',n:'สลายพลัง',v:eff.acc,u:eff.u});lg('lS',`&nbsp;✗ ${CH[ds].n}: ${rm?`สลาย[${rm.n||'บัฟ'}]`:''} Acc${eff.acc}(${eff.u}ตา)`);}
}

function decCD(s){battle.cd[s]=battle.cd[s].map(v=>Math.max(0,v-1));battle.iaCD[s]=Math.max(0,battle.iaCD[s]-1);}

function resolveSk(side,idx){
  battle.turn++;tickFX();if(battle.winner)return;
  const skId=EQ[side][idx];if(!skId)return;
  const sk=gSk(skId);if(!sk)return;
  battle.cd[side][idx]=TIERS[sk.ti].cd;
  const ds=opp(side),cls=side==='A'?'lA':'lB',nm=CH[side].n;
  const ti=sk.at==='phy'?'⚔':sk.at==='int'?'💜':sk.se?'⟳':'💥';
  if(sk.at){
    const res=calcDmg(side,sk);
    const pn=`<span class="lp">[hit${res.hp}% crit${res.cp}%]</span>`;
    if(!res.hit){lg(cls,`[${battle.turn}] ${nm} → <b>${sk.n}</b>${ti} <span style="color:#AAA">พลาด!</span> ${pn}`);}
    else{
      battle['h'+ds]=Math.max(0,battle['h'+ds]-res.dmg);
      const dt=res.crit?`<span class="lC">★CRIT! ${res.dmg}</span>`:`<b>${res.dmg}</b>`;
      lg(cls,`[${battle.turn}] ${nm} → <b>${sk.n}</b>${ti} ${dt} ${pn}`);
      if((sk.dr||0)>0){const h=Math.round(res.dmg*sk.dr/100);battle['h'+side]=Math.min(battle['d'+side].HP,battle['h'+side]+h);lg('lS',`&nbsp;→ ดูด ${h} HP`);}
      if(res.refl>0){battle['h'+side]=Math.max(0,battle['h'+side]-res.refl);lg('lS',`&nbsp;↩ สะท้อน ${res.refl}`);}
      // on_hit weapon effect
      const wep=EQUIP.find(e=>e.id===eqd[side].W);
      if(wep&&wep.eff&&wep.eff.t==='on_hit'&&wep.eff.db){addDeb(ds,{...wep.eff.db,n:wep.eff.db.t.replace('debuff_','')+'↓'});lg('lS',`&nbsp;🗡 ${wep.n}: ${wep.eff.db.t.replace('debuff_','')}${wep.eff.db.v}(${wep.eff.db.u}ตา)`);}
      if(res.crit)chkPas(side,'on_crit');
      chkPas(ds,'hit_recv');
      if(sk.at==='int')chkPas(side,'use_int');
      checkWin();
    }
  }else{lg(cls,`[${battle.turn}] ${nm} → <b>${sk.n}</b>${ti}`);}
  if(!battle.winner){if(sk.se)applySelf(side,sk.se);if(sk.ee)applyEnemy(side,sk.ee);}
  lg('lS',`&nbsp;A:${battle.hA}/${battle.dA.HP} · B:${battle.hB}/${battle.dB.HP}`);
}

function resolveIA(s){
  const art=gArt(s);if(!art.act)return false;
  const act=art.act;
  if(battle.iaCD[s]>0){lg('lS',`[IA] ${CH[s].n}: กำลังภายใน CD ${battle.iaCD[s]}`);return false;}
  if(battle['mp'+s]<act.c){lg('lS',`[IA] ${CH[s].n}: MP ไม่พอ`);return false;}
  battle['mp'+s]-=act.c;
  battle.iaCD[s]=act.cd||0;  // set CD
  battle.turn++;tickFX();if(battle.winner)return true;
  const cls=s==='A'?'lA':'lB',nm=CH[s].n,ds=opp(s),ad=battle['d'+s],dd=battle['d'+ds],dst=battle.st[ds];
  let fD=0,pR=0,ref=0;dst.buffs.forEach(b=>{if(b.t==='buff_def')fD+=b.v;if(b.t==='buff_reduce')pR+=b.v;if(b.t==='buff_reflect')ref=b.v;});
  const pn=(hp,cp)=>`<span class="lp">[hit${hp}% crit${cp}%]</span>`;
  // hit/crit helper for IA attacks
  function iaMiss(){
    let ea=ad.Acc;battle.st[s].debuffs.forEach(d=>{if(d.t==='debuff_acc')ea=Math.max(0,ea+d.v);});
    let ee=dd.Eva;dst.debuffs.forEach(d=>{if(d.t==='debuff_eva')ee=Math.max(0,ee+d.v);});dst.buffs.forEach(b=>{if(b.t==='buff_eva')ee+=b.v;});
    return {ea,ee,hp:Math.round(hpPct(ea,ee)),cp:Math.round(crPct(ad.Cri,dd.Res))};
  }
  function doAtkHit(rawDmg,hc){
    const crit=Math.random()*100<hc.cp,dmg=Math.round(rawDmg*(crit?1.5:1));
    battle['h'+ds]=Math.max(0,battle['h'+ds]-dmg);
    if(ref>0){const rd=Math.round(dmg*ref/100);battle['h'+s]=Math.max(0,battle['h'+s]-rd);dst.buffs=dst.buffs.filter(b=>b.t!=='buff_reflect');lg('lS',`&nbsp;↩ สะท้อน${rd}`);}
    return{dmg,crit};
  }
  if(act.t==='heal'){
    const h=Math.round(battle['d'+s].HP*act.h/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+h);
    lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → ฟื้น <b>${h}</b> HP`);
  }
  else if(act.t==='heal_cleanse'){
    const h=Math.round(battle['d'+s].HP*act.h/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+h);
    const rm=battle.st[s].debuffs.pop();
    lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → ฟื้น <b>${h}</b> HP${rm?` +ลบ[${rm.n}]`:''}`);
  }
  else if(act.t==='atk_phy_pen'){
    const hc=iaMiss();
    if(Math.random()*100>=hc.hp){lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → <span style="color:#AAA">พลาด!</span> ${pn(hc.hp,hc.cp)}`);}
    else{const raw=Math.max(1,(ad.Atk+ad.PA)*act.m-(dd.PD*(1-act.pen/100)+fD))*(1-pR/100),r=doAtkHit(raw,hc);const dt=r.crit?`<span class="lC">★CRIT! ${r.dmg}</span>`:`<b>${r.dmg}</b>`;lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b>⚔ ${dt} ${pn(hc.hp,hc.cp)}`);checkWin();}
  }
  else if(act.t==='buff_reflect'){addBuf(s,{t:'buff_reflect',n:'สะท้อน',v:act.v,u:act.u});lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → สะท้อน${act.v}%(${act.u}ตา)`);}
  else if(act.t==='buff_reduce'){addBuf(s,{t:'buff_reduce',n:'เกราะ',v:act.v,u:act.u});lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → ลดdmg${act.v}%(${act.u}ตา)`);}
  else if(act.t==='drain'){
    const hc=iaMiss();
    if(Math.random()*100>=hc.hp){lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → <span style="color:#AAA">พลาด!</span> ${pn(hc.hp,hc.cp)}`);}
    else{const raw=Math.max(1,(ad.Atk+ad.IA)*act.m-(dd.ID+fD))*(1-pR/100),r=doAtkHit(raw,hc);const heal=Math.round(r.dmg*act.h/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+heal);const dt=r.crit?`<span class="lC">★CRIT! ${r.dmg}</span>`:`<b>${r.dmg}</b>`;lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b>💜 ${dt} + ฟื้น <b>${heal}</b> ${pn(hc.hp,hc.cp)}`);checkWin();}
  }
  else if(act.t==='debuff_acc_dmg'){
    addDeb(ds,{t:'debuff_acc',n:'สับสน',v:act.ad,u:act.u});  // debuff applies regardless
    const hc=iaMiss();
    if(Math.random()*100>=hc.hp){lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → Acc${act.ad} + <span style="color:#AAA">พลาด!</span> ${pn(hc.hp,hc.cp)}`);}
    else{const raw=Math.max(1,(ad.Atk+ad.IA)*act.dm-(dd.ID+fD))*(1-pR/100),r=doAtkHit(raw,hc);const dt=r.crit?`<span class="lC">★CRIT! ${r.dmg}</span>`:`<b>${r.dmg}</b>`;lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → Acc${act.ad} + ${dt} ${pn(hc.hp,hc.cp)}`);checkWin();}
  }
  else if(act.t==='debuff_poison'){
    addDeb(ds,{t:'debuff_poison',n:'พิษ',pp:act.pp,u:act.u});
    addDeb(ds,{t:'debuff_eva',n:'พิษEva',v:act.ev,u:act.u});
    lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → พิษ${act.pp}%/ตา Eva${act.ev}`);
  }
  else if(act.t==='drain_phy'){
    const hc=iaMiss();
    if(Math.random()*100>=hc.hp){lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → <span style="color:#AAA">พลาด!</span> ${pn(hc.hp,hc.cp)}`);}
    else{const raw=Math.max(1,(ad.Atk+ad.PA)*act.m-(dd.PD+fD))*(1-pR/100),r=doAtkHit(raw,hc);const heal=Math.round(r.dmg*act.h/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+heal);const dt=r.crit?`<span class="lC">★CRIT! ${r.dmg}</span>`:`<b>${r.dmg}</b>`;lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b>⚔ ${dt} + ฟื้น <b>${heal}</b> ${pn(hc.hp,hc.cp)}`);checkWin();}
  }
  else if(act.t==='atk_int_pen'){
    const hc=iaMiss();
    if(Math.random()*100>=hc.hp){lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → <span style="color:#AAA">พลาด!</span> ${pn(hc.hp,hc.cp)}`);}
    else{const raw=Math.max(1,(ad.Atk+ad.IA)*act.m-(dd.ID*(1-act.pen/100)+fD))*(1-pR/100),r=doAtkHit(raw,hc);const dt=r.crit?`<span class="lC">★CRIT! ${r.dmg}</span>`:`<b>${r.dmg}</b>`;lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b>💜 ${dt} ${pn(hc.hp,hc.cp)}`);checkWin();}
  }
  else if(act.t==='buff_eva_debuff_eva'){
    addBuf(s,{t:'buff_eva',n:'ว่องไว',v:act.selfV,u:act.u});
    addDeb(ds,{t:'debuff_eva',n:'ทราย',v:act.eneV,u:act.u});
    lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → Eva+${act.selfV} / ศัตรู Eva${act.eneV}(${act.u}ตา)`);
  }
  else if(act.t==='drain_acc'){
    addDeb(ds,{t:'debuff_acc',n:'จุดจำ',v:act.adv,u:2});
    const hc=iaMiss();
    if(Math.random()*100>=hc.hp){lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b> → Acc${act.adv} + <span style="color:#AAA">พลาด!</span> ${pn(hc.hp,hc.cp)}`);}
    else{const raw=Math.max(1,(ad.Atk+ad.IA)*act.m-(dd.ID+fD))*(1-pR/100),r=doAtkHit(raw,hc);const heal=Math.round(r.dmg*act.h/100);battle['h'+s]=Math.min(battle['d'+s].HP,battle['h'+s]+heal);const dt=r.crit?`<span class="lC">★CRIT! ${r.dmg}</span>`:`<b>${r.dmg}</b>`;lg(cls,`[${battle.turn}] ${nm} ⚡<b>${act.n}</b>💜 ${dt} + ฟื้น <b>${heal}</b> ${pn(hc.hp,hc.cp)}`);checkWin();}
  }
  const p=art.pas;if(p&&p.tr==='use_act')chkPas(s,'use_act');
  lg('lS',`&nbsp;A:${battle.hA}/${battle.dA.HP} · B:${battle.hB}/${battle.dB.HP}`);
  return true;
}

function getNext(){
  // BASE=60: ต้องเร็วกว่า 5× ถึงได้ 2 ตาต่อ 1 ตาของฝ่ายตรงข้าม
  // สูตร: (Spd+60)/(SpeedB+60)=2 เมื่อ Spd=5×SpeedB
  const BASE=60,lim=100000;let i=0;
  while(battle.gA<100&&battle.gB<100&&i++<lim){battle.gA+=battle.dA.Spd+BASE;battle.gB+=battle.dB.Spd+BASE;}
  if(battle.gA>=battle.gB){battle.gA=Math.max(0,battle.gA-100);return'A';}
  battle.gB=Math.max(0,battle.gB-100);return'B';
}

function doAI(s){const art=gArt(s),mp=battle['mp'+s];const avail=EQ[s].map((id,i)=>({id,i,cd:battle.cd[s][i]})).filter(x=>x.id&&x.cd===0);const canIA=art.act&&mp>=art.act.c&&battle.iaCD[s]===0;if(canIA&&Math.random()<0.2)resolveIA(s);else if(avail.length>0)resolveSk(s,avail[Math.floor(Math.random()*avail.length)].i);}

function proceed(){
  if(battle.winner||battle.phase==='over'){renderBV();return;}
  const nx=getNext();decCD(nx);
  battle.phase=nx==='A'?'player':'enemy';renderBV();
  if(battle.phase==='enemy'){ato=setTimeout(()=>{if(!battle||battle.phase!=='enemy')return;doAI('B');if(!battle.winner)proceed();else renderBV();},750);}
}

function useSkill(i){if(!battle||battle.phase!=='player')return;battle.phase='resolving';resolveSk('A',i);if(!battle.winner)proceed();else renderBV();}
function useIA_act(){if(!battle||battle.phase!=='player')return;battle.phase='resolving';resolveIA('A');if(!battle.winner)proceed();else renderBV();}

function SB(){
  if(ato){clearTimeout(ato);ato=null;}
  const dA=deriveAll('A'),dB=deriveAll('B');
  battle={dA,dB,hA:dA.HP,hB:dB.HP,mpA:dA.MP,mpB:dB.MP,gA:0,gB:0,turn:0,log:[],winner:null,phase:'start',
    st:{A:{buffs:[],debuffs:[],stk:0},B:{buffs:[],debuffs:[],stk:0}},cd:{A:[0,0,0,0,0],B:[0,0,0,0,0]},iaCD:{A:0,B:0}};
  lg('lS','━━ เริ่มการต่อสู้ ━━');
  const mas=getMas('A');Object.entries(mas).forEach(([w,v])=>lg('lS',`A: ${w} ×${(1+v/200*.5).toFixed(2)}`));
  const aA=gArt('A'),aB=gArt('B');
  if(aA.id!=='none')lg('lS',`A IA: ${aA.n} ขั้น${alv.A} HP+${aA.hL*alv.A} MP+${aA.mL*alv.A}`);
  if(aB.id!=='none')lg('lS',`B IA: ${aB.n} ขั้น${alv.B} HP+${aB.hL*alv.B} MP+${aB.mL*alv.B}`);
  proceed();
}

function autoFull(){
  if(!battle||battle.phase==='over')return;let saf=250;
  const step=()=>{
    if(!battle||battle.phase==='over'||saf--<=0){renderBV();return;}
    const s=battle.phase==='player'?'A':'B';decCD(s);doAI(s);
    if(battle.winner){renderBV();return;}
    const nx=getNext();battle.phase=nx==='A'?'player':'enemy';setTimeout(step,60);
  };step();
}
function resetBattle(){if(ato){clearTimeout(ato);ato=null;}battle=null;renderBV();}

function bfHtml(s){const st=battle.st[s];return st.buffs.map(b=>`<span class="bf">${b.n}(${b.u})</span>`).join('')+st.debuffs.map(d=>`<span class="db">${d.n}(${d.u})</span>`).join('')+(st.stk>0?`<span class="stk">ATK+${st.stk*3}%</span>`:'');}

function renderBV(){
  const bv=document.getElementById('bv');if(!bv)return;
  if(!battle){bv.innerHTML=`<div style="text-align:center;padding:3rem 0"><div style="font-size:13px;color:#888;margin-bottom:16px">ตั้งค่าตัวละครและเลือกวิชาก่อน</div><button class="btn-s" onclick="SB()">⚔ เริ่มการต่อสู้</button></div>`;return;}
  const pA=Math.max(0,battle.hA/battle.dA.HP*100),pB=Math.max(0,battle.hB/battle.dB.HP*100);
  const mpAp=battle.dA.MP>0?Math.max(0,battle.mpA/battle.dA.MP*100):0,mpBp=battle.dB.MP>0?Math.max(0,battle.mpB/battle.dB.MP*100):0;
  const gA=Math.min(100,battle.gA),gB=Math.min(100,battle.gB);
  const iA=battle.phase==='player',iB=battle.phase==='enemy'||battle.phase==='resolving';
  const hAB=Math.round(hpPct(battle.dA.Acc,battle.dB.Eva)),hBA=Math.round(hpPct(battle.dB.Acc,battle.dA.Eva));
  const cAB=Math.round(crPct(battle.dA.Cri,battle.dB.Res)),cBA=Math.round(crPct(battle.dB.Cri,battle.dA.Res));
  const artA=gArt('A'),artB=gArt('B');

  const panel=(s,isAct,hp,mpp,g,gc,hab,cab,art)=>`
    <div class="cp ${isAct?(s==='A'?'aA':'aB'):''}">
      <div class="cn">${CH[s].n}${art.id!=='none'?` <span style="font-size:10px;color:${s==='A'?'#534AB7':'#993C1D'}">[${art.n.substring(0,7)}${alv[s]}]</span>`:''}</div>
      <div class="cht">${battle['h'+s]} / ${battle['d'+s].HP} HP</div>
      <div class="hpb"><div class="hpf" style="width:${hp}%;background:${hpC(hp)}"></div></div>
      ${battle['d'+s].MP>0?`<div class="cht">${battle['mp'+s]} / ${battle['d'+s].MP} MP</div><div class="mpb"><div class="mpf" style="width:${mpp}%"></div></div>`:''}
      <div class="cht" style="margin-top:3px">ATB</div>
      <div class="atbb"><div class="atbf" style="width:${g}%;background:${gc}"></div></div>
      <div class="sr2"><span class="sm">SPD <b>${battle['d'+s].Spd}</b></span><span class="sm">Acc <b>${battle['d'+s].Acc}</b></span><span class="sm">Eva <b>${battle['d'+s].Eva}</b></span><span class="sm">Cri <b>${battle['d'+s].Cri}</b></span></div>
      <div style="font-size:11px;color:#888;margin-top:3px">Hit<b style="color:#1D9E75"> ${hab}%</b> · Crit<b style="color:#BA7517"> ${cab}%</b></div>
      <div class="brow">${bfHtml(s)}</div>
    </div>`;

  let win='';
  if(battle.winner){const wn=CH[battle.winner].n,wc=battle.winner==='A'?'#EEEDFE':'#FAECE7',tc=battle.winner==='A'?'#3C3489':'#993C1D';win=`<div class="winbanner" style="background:${wc}"><div style="font-size:20px;font-weight:700;color:${tc}">🏆 ${wn} ชนะ!</div><div style="font-size:12px;color:#888;margin-top:4px">${battle.turn} ตา</div></div>`;}

  let ctrl='';
  if(battle.winner){ctrl=`<div class="ctrl"><button class="btn-s" onclick="SB()">เริ่มใหม่</button><button class="btn-r" onclick="resetBattle()">Reset</button></div>`;}
  else if(battle.phase==='player'){
    const aA=gArt('A'),canIA=aA.act&&battle.mpA>=aA.act.c&&battle.iaCD.A===0;
    const skBtns=EQ.A.map((id,i)=>{
      if(!id)return'';
      const sk=gSk(id);if(!sk)return'';
      const cd=battle.cd.A[i],onCd=cd>0,t=TIERS[sk.ti];
      return `<button class="skb" onclick="${onCd?'':'useSkill('+i+')'}" ${onCd?'disabled':''}><span class="skbn">${sk.n}</span><span class="skbi">${sk.at==='phy'?'⚔':sk.at==='int'?'💜':sk.se?'⟳':'💥'} ${sk.w} ${onCd?`<span class="cdb">CD ${cd}</span>`:`<span style="font-size:9px">${t.n}</span>`}</span></button>`;
    }).join('');
    const iaCDval=battle.iaCD.A,iaOnCD=iaCDval>0;
    ctrl=`<div style="font-size:12px;color:#888;text-align:center;margin-bottom:7px">เลือกวิชา: <b>${CH.A.n}</b></div><div class="skbs">${skBtns}${aA.act?`<button class="skb ia" onclick="useIA_act()" ${canIA?'':'disabled'}><span class="skbn">⚡ ${aA.act.n}</span><span class="skbi">MP ${aA.act.c}/${battle.mpA} ${iaOnCD?`<span class="cdb">CD ${iaCDval}</span>`:`<span style="font-size:9px">CD${aA.act.cd}</span>`}</span></button>`:''}</div><div class="ctrl"><button class="btn-a" onclick="autoFull()">Auto ▶▶</button><button class="btn-r" onclick="resetBattle()">Reset</button></div>`;
  }else{ctrl=`<div class="think">${CH.B.n} กำลังโจมตี...</div><div class="ctrl"><button class="btn-r" onclick="resetBattle()">Reset</button></div>`;}

  bv.innerHTML=`<div class="btop">${panel('A',iA,pA,mpAp,gA,'#7F77DD',hAB,cAB,artA)}<div class="vsb">VS</div>${panel('B',iB,pB,mpBp,gB,'#D85A30',hBA,cBA,artB)}</div>${win}<div class="blog">${battle.log.slice().reverse().map(l=>`<div class="${l.cls}">${l.txt}</div>`).join('')}</div>${ctrl}`;
}

// === SEARCHABLE DROPDOWNS ===
function makeSearchable(root){
  root.querySelectorAll('select').forEach(sel=>{
    if(sel.dataset.ms)return;
    sel.dataset.ms='1';
    const wrap=document.createElement('span');
    wrap.className='ss-wrap';
    sel.parentNode.insertBefore(wrap,sel);
    // transfer classes (eq-sel, etc) to wrap
    if(sel.classList.contains('eq-sel'))sel.classList.remove('eq-sel');
    const dd=document.createElement('div');dd.className='ss-dd';
    const si=document.createElement('input');si.type='text';si.className='ss-inp';
    si.placeholder='🔍 ค้นหา...';
    // set initial label — ถ้าเป็น option แรก (placeholder/none) ให้แสดง placeholder แทน
    const curOpt=sel.options[sel.selectedIndex];
    if(curOpt&&sel.selectedIndex>0)si.value=curOpt.text;
    // build dropdown items from current select options
    const buildDD=(q='')=>{
      dd.innerHTML='';
      let lastGrp='',dd_idx=0;
      for(const opt of sel.options){
        if(opt.tagName==='OPTGROUP'){lastGrp=opt.label;continue;}
        const txt=opt.text,val=opt.value;
        if(q&&!txt.toLowerCase().includes(q.toLowerCase()))continue;
        if(opt.parentElement.tagName==='OPTGROUP'&&opt.parentElement.label!==lastGrp){
          lastGrp=opt.parentElement.label;
          const grpEl=document.createElement('div');grpEl.className='ss-grp';grpEl.textContent=lastGrp;dd.appendChild(grpEl);
        }
        const li=document.createElement('div');
        li.className='ss-opt'+(val===sel.value?' ss-cur':'');
        li.textContent=txt;
        li.onmousedown=e=>{e.preventDefault();sel.value=val;si.value=(val&&dd_idx>0)?txt:'';dd.style.display='none';sel.dispatchEvent(new Event('change'));};
        dd_idx++;
        dd.appendChild(li);
      }
    };
    si.addEventListener('focus',()=>{buildDD();dd.style.display='block';si.select();});
    si.addEventListener('input',()=>{buildDD(si.value);dd.style.display='block';});
    si.addEventListener('blur',()=>{setTimeout(()=>{dd.style.display='none';},180);});
    sel.style.display='none';
    wrap.appendChild(si);wrap.appendChild(dd);
  });
}

    el.appendChild(row);

  rPts(s);rMax(s);rDv(s);rIA(s);rSS(s);rEQ(s);
  makeSearchable(document.getElementById('ia'+s));
  makeSearchable(document.getElementById('ss'+s));
  makeSearchable(document.getElementById('eq'+s));
});
